name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

env:
  # Valores de relleno: la compilación y las pruebas no necesitan hablar con Supabase.
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.invalid
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key

jobs:
  build-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Pruebas unitarias y de autorización
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Guardar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/

  dependencias:
    name: Análisis de dependencias (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (falla con vulnerabilidades altas o críticas)
        run: npm audit --audit-level=high

  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dast:
    name: DAST con OWASP ZAP
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Levantar la app
        run: |
          npm start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
      - name: Escaneo base de ZAP
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3000
          fail_action: false
          allow_issue_writing: false
